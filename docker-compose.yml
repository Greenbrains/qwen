services:
  travel-agent:
    build: .
    container_name: tutu-travel-agent
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    healthcheck:
      # Используем встроенный urllib, чтобы не зависеть от библиотеки requests
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # Максимальный размер одного файла лога
        max-file: "3"     # Хранить только 3 последних файла (итого макс ~30 МБ)
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge