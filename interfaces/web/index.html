<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutu Travel Agent — Web Interface</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #333; }
        .status {
            display: inline-block;
            padding: 8px 16px;
            background: #ff9800;
            color: white;
            border-radius: 20px;
            font-size: 14px;
            margin: 20px 0;
        }
        .info {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }
        code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧳 Tutu Travel Agent</h1>
        <div class="status">🚧 В разработке (v2.0)</div>
        
        <div class="info">
            <h3>Текущий статус</h3>
            <p>Веб-интерфейс находится в разработке и будет доступен в версии 2.0.</p>
            
            <h3>Как использовать сейчас</h3>
            <p>Запустите консольный режим:</p>
            <pre><code>python main.py --mode cli</code></pre>
            
            <p>Или используйте <code>start.bat</code> для быстрого запуска.</p>
        </div>
        
        <p style="color: #666; margin-top: 40px;">
            © 2026 Tutu Travel Agent | miniB v1.0
        </p>
    </div>
</body>
</html>
