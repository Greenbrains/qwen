<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root {
            --primary-color: #00A651; /* Зеленый Green Brain */
            --secondary-color: #007a3d;
            --text-color: #333;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); }
        
        header { background-color: var(--card-bg); box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary-color); text-decoration: none; }
        nav a { text-decoration: none; color: #555; margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        nav a:hover, nav a.active { color: var(--primary-color); }

        .hero { text-align: center; padding: 4rem 1rem; background: linear-gradient(135deg, #e8f5e9 0%, #ffffff 100%); }
        .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--primary-color); }
        .hero p { font-size: 1.2rem; color: #666; max-width: 600px; margin: 0 auto; }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        /* Сетка карточек */
        .destinations-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
        
        .card { background: var(--card-bg); border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        .card-icon { font-size: 5rem; text-align: center; padding: 2.5rem 0; background-color: #f0fdf4; line-height: 1; }
        
        .card-content { padding: 1.5rem; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 1.4rem; margin: 0 0 0.5rem 0; color: var(--text-color); }
        .card-desc { color: #666; margin-bottom: 1.5rem; line-height: 1.5; font-size: 0.95rem; }
        
        .btn-details { display: inline-block; padding: 0.8rem 1.5rem; background-color: var(--primary-color); color: white; text-decoration: none; border-radius: 25px; font-weight: 600; border: none; cursor: pointer; transition: background 0.3s; width: fit-content; margin: 0 auto; }
        .btn-details:hover { background-color: var(--secondary-color); }

        /* Экран деталей страны и чата */
        #countryView { display: none; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .back-btn { background: none; border: none; color: #666; cursor: pointer; font-size: 1rem; display: flex; align-items: center; margin-bottom: 1rem; padding: 0; }
        .back-btn:hover { color: var(--primary-color); }
        
        .country-header { text-align: center; margin-bottom: 2rem; }
        .country-flag { font-size: 4rem; display: block; margin-bottom: 0.5rem; }
        .country-name { font-size: 2.5rem; color: var(--primary-color); margin: 0; }
        .country-desc { font-size: 1.2rem; color: #555; max-width: 800px; margin: 1rem auto; line-height: 1.6; }

        /* Чат */
        .chat-container { max-width: 800px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 600px; }
        .chat-header { background: var(--primary-color); color: white; padding: 1rem 1.5rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 1.5rem; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; gap: 1rem; }
        
        .message { max-width: 80%; padding: 0.8rem 1.2rem; border-radius: 15px; line-height: 1.4; word-wrap: break-word; }
        .message.agent { align-self: flex-start; background: white; border: 1px solid #eee; color: #333; border-bottom-left-radius: 2px; }
        .message.user { align-self: flex-end; background: var(--primary-color); color: white; border-bottom-right-radius: 2px; }
        
        .chat-input-area { padding: 1rem; background: white; border-top: 1px solid #eee; display: flex; gap: 0.5rem; }
        .chat-input { flex: 1; padding: 0.8rem 1.2rem; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 1rem; }
        .chat-input:focus { border-color: var(--primary-color); }
        .send-btn { background: var(--primary-color); color: white; border: none; padding: 0 1.5rem; border-radius: 25px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        .send-btn:hover { background: var(--secondary-color); }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* Адаптив */
        @media (max-width: 600px) {
            .hero h1 { font-size: 1.8rem; }
            .card-icon { font-size: 3.5rem; padding: 1.5rem 0; }
            .chat-container { height: 70vh; }
        }
    </style>
</head>
<body>

<header>
    <a href="/" class="logo">Green Brain</a>
    <nav>
        <a href="/">Главная</a>
        <a href="/agent" class="active">Агент путешествий</a>
    </nav>
</header>

<div class="hero">
    <h1>Открой для себя мир путешествий</h1>
    <p>Выберите направление, и наш ИИ-агент составит идеальный маршрут именно для вас</p>
</div>

<div class="container">
    <!-- Сетка направлений -->
    <div id="gridView" class="destinations-grid">
        <!-- Карточки генерируются JS -->
    </div>

    <!-- Вид страны и чата -->
    <div id="countryView">
        <button class="back-btn" onclick="showGrid()">← Назад к направлениям</button>
        
        <div class="country-header">
            <span class="country-flag" id="viewFlag">🌍</span>
            <h2 class="country-name" id="viewTitle">Страна</h2>
            <p class="country-desc" id="viewDesc">Описание...</p>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <span id="chatHeaderTitle">Чат с агентом</span>
                <span style="font-size: 0.8rem; opacity: 0.8;">Online</span>
            </div>
            <div class="chat-messages" id="chatBox">
                <!-- Сообщения -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" class="chat-input" placeholder="Спросите про отели, визы или погоду..." onkeypress="handleEnter(event)">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Данные о направлениях
    const destinations = [
        { id: 'ru', name: 'Россия', flag: '🇷🇺', icon: '🏰', desc: 'От золотых куполов Москвы до вулканов Камчатки. Огромная страна с богатейшей историей.' },
        { id: 'mv', name: 'Мальдивы', flag: '🇲🇻', icon: '🏝️', desc: 'Райские острова с кристально чистой водой. Идеально для дайвинга и романтического отдыха.' },
        { id: 'ch', name: 'Швейцария', flag: '🇨🇭', icon: '🏔️', desc: 'Величественные Альпы, чистейшие озера и лучшие лыжные курорты мира.' },
        { id: 'jp', name: 'Япония', flag: '🇯🇵', icon: '⛩️', desc: 'Уникальная культура, где древние традиции встречаются с передовыми технологиями.' },
        { id: 'it', name: 'Италия', flag: '🇮🇹', icon: '🍕', desc: 'Искусство, история, кулинария и лучший кофе в мире. От Рима до Венеции.' },
        { id: 'is', name: 'Исландия', flag: '🇮🇸', icon: '🌌', desc: 'Земля льда и пламени. Северное сияние, гейзеры и невероятные пейзажи.' },
        { id: 'id', name: 'Бали', flag: '🇮🇩', icon: '🌴', desc: 'Тропический рай, тысячи храмов, серфинг и джунгли.' }
    ];

    let currentCountry = null;

    // Инициализация сетки
    const gridEl = document.getElementById('gridView');
    destinations.forEach(dest => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openCountry(dest.id);
        card.innerHTML = \
            <div class="card-icon">\</div>
            <div class="card-content">
                <div>
                    <h3 class="card-title">\</h3>
                    <p class="card-desc">\</p>
                </div>
                <button class="btn-details">Подробнее →</button>
            </div>
        \;
        gridEl.appendChild(card);
    });

    function openCountry(id) {
        const dest = destinations.find(d => d.id === id);
        if (!dest) return;
        currentCountry = dest;

        // Заполняем данные
        document.getElementById('viewFlag').textContent = dest.flag;
        document.getElementById('viewTitle').textContent = dest.name;
        document.getElementById('viewDesc').textContent = dest.desc;
        document.getElementById('chatHeaderTitle').textContent = \Агент: \\;
        
        // Переключаем вид
        document.getElementById('gridView').style.display = 'none';
        document.getElementById('countryView').style.display = 'block';
        
        // Приветственное сообщение
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        addMessage(\Здравствуйте! Я помогу вам спланировать поездку в \. Что вас интересует в первую очередь: отели, перелет или экскурсии?\, 'agent');
    }

    function showGrid() {
        document.getElementById('countryView').style.display = 'none';
        document.getElementById('gridView').style.display = 'grid';
        currentCountry = null;
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function addMessage(text, sender) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = \message \\;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const btn = document.getElementById('sendBtn');
        const text = input.value.trim();
        
        if (!text || !currentCountry) return;

        // Добавляем сообщение пользователя
        addMessage(text, 'user');
        input.value = '';
        input.disabled = true;
        btn.disabled = true;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: text,
                    context: { country: currentCountry.name }
                })
            });

            if (!response.ok) throw new Error('Ошибка сети');
            
            const data = await response.json();
            addMessage(data.response, 'agent');
        } catch (error) {
            addMessage('Извините, возникла ошибка соединения с сервером.', 'agent');
            console.error(error);
        } finally {
            input.disabled = false;
            btn.disabled = false;
            input.focus();
        }
    }
</script>

</body>
</html>
